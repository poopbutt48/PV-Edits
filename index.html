<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PV Edits</title>
<style>
:root {
  color-scheme: dark;
  --bg: #1f1f1f;
  --canvas: #161616;
  --panel: #383838;
  --panel-head: #333;
  --panel-deep: #2c2c2c;
  --line: #1b1b1b;
  --edge: #4a4a4a;
  --text: #a8a8a8;
  --text-hi: #e6e6e6;
  --accent: #4a9cff;
  --good: #6fae5a;
  --bad: #c4584c;
  --star: #e0b84a;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg); color: var(--text); font: 11px/1.35 var(--font);
  padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
  -webkit-text-size-adjust: 100%; -webkit-user-select: none; user-select: none;
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---- top bar ---- */
.topbar {
  display: flex; align-items: center; gap: 4px; padding: 0 10px; height: 38px; flex: none;
  background: #2a2a2a; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none;
}
.topbar::-webkit-scrollbar { display: none; }
.plate { color: var(--text-hi); font-size: 14px; font-weight: 600; letter-spacing: .02em; margin-right: 18px; white-space: nowrap; }
.plate b { color: var(--accent); font-weight: 600; }
.modules { display: flex; gap: 2px; }
.mod {
  background: none; border: 0; padding: 4px 10px; color: #7d7d7d; font-size: 12px; position: relative; white-space: nowrap;
}
.mod + .mod::before { content: ""; position: absolute; left: -2px; top: 6px; bottom: 6px; width: 1px; background: #444; }
.mod.on { color: var(--text-hi); }
.mod:hover { color: var(--text-hi); }
.spacer { flex: 1; }
.tb {
  background: transparent; border: 1px solid transparent; border-radius: 3px; padding: 5px 10px; color: var(--text-hi);
  white-space: nowrap; flex: none;
}
.tb:hover { background: #3a3a3a; }
.tb:disabled { opacity: .35; cursor: default; background: transparent; }
.tb.primary { background: var(--accent); color: #fff; }
.tb.on { background: #4b4b4b; }

/* ---- workspace ---- */
.workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: 252px minmax(0, 1fr) 316px; }
.panel { background: var(--panel); min-height: 0; display: flex; flex-direction: column; }
.panel.left { border-right: 1px solid var(--line); }
.panel.right { border-left: 1px solid var(--line); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.foot {
  flex: none; display: flex; gap: 6px; padding: 8px 10px; background: var(--panel-head); border-top: 1px solid var(--line);
}
.foot .tb { flex: 1; background: #484848; border-color: #555; }
.stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--canvas); }
.viewer { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#view { width: 100%; height: 100%; object-fit: contain; display: block; }
.empty {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; text-align: center; padding: 20px;
}
.empty h2 { margin: 0; font-size: 16px; font-weight: 600; color: var(--text-hi); }
.empty p { margin: 0; max-width: 36ch; font-size: 12px; }
.badge {
  position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.6); color: var(--text-hi);
  padding: 2px 8px; border-radius: 3px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
}
.dropping::after {
  content: "Drop files to import"; position: absolute; inset: 8px; border: 2px dashed var(--accent);
  display: flex; align-items: center; justify-content: center; color: var(--text-hi); background: rgba(20,20,20,.75);
  font-size: 15px; pointer-events: none; z-index: 5;
}
.btn {
  background: #4a4a4a; border: 1px solid #5a5a5a; border-radius: 3px; padding: 5px 12px; color: var(--text-hi);
  display: inline-flex; align-items: center; justify-content: center; white-space: nowrap;
}
.btn:hover { background: #555; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.small { padding: 3px 8px; font-size: 11px; }
.btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }

/* crop overlay */
#cropLayer { position: absolute; pointer-events: none; }
#cropRect { position: absolute; box-shadow: 0 0 0 9999px rgba(0,0,0,.6); border: 1px solid #fff; pointer-events: auto; cursor: move; touch-action: none; }
#cropRect::before, #cropRect::after { content: ""; position: absolute; pointer-events: none; }
#cropRect::before { left: 33.33%; right: 33.33%; top: 0; bottom: 0; border-left: 1px solid rgba(255,255,255,.35); border-right: 1px solid rgba(255,255,255,.35); }
#cropRect::after { top: 33.33%; bottom: 33.33%; left: 0; right: 0; border-top: 1px solid rgba(255,255,255,.35); border-bottom: 1px solid rgba(255,255,255,.35); }
.hd { position: absolute; width: 26px; height: 26px; touch-action: none; pointer-events: auto; z-index: 2; }
.hd::after { content: ""; position: absolute; width: 10px; height: 10px; background: #fff; border: 1px solid #000; left: 8px; top: 8px; }
.hd[data-h=nw] { left: -13px; top: -13px; cursor: nwse-resize; } .hd[data-h=ne] { right: -13px; top: -13px; cursor: nesw-resize; }
.hd[data-h=sw] { left: -13px; bottom: -13px; cursor: nesw-resize; } .hd[data-h=se] { right: -13px; bottom: -13px; cursor: nwse-resize; }
.hd[data-h=n] { left: calc(50% - 13px); top: -13px; cursor: ns-resize; } .hd[data-h=s] { left: calc(50% - 13px); bottom: -13px; cursor: ns-resize; }
.hd[data-h=w] { top: calc(50% - 13px); left: -13px; cursor: ew-resize; } .hd[data-h=e] { top: calc(50% - 13px); right: -13px; cursor: ew-resize; }

/* toolbar under image */
.toolbar {
  display: flex; align-items: center; gap: 4px; padding: 4px 10px; flex: none; background: #2a2a2a; border-top: 1px solid var(--line); min-height: 32px;
  overflow-x: auto; scrollbar-width: none;
}
.toolbar::-webkit-scrollbar { display: none; }
.stars { display: flex; }
.star { background: none; border: 0; padding: 2px 3px; color: #666; font-size: 14px; line-height: 1; }
.star.on { color: var(--star); }
.flag { background: none; border: 1px solid transparent; padding: 2px 7px; border-radius: 2px; font-weight: 700; color: #777; }
.flag.p.on { color: #fff; background: var(--good); } .flag.x.on { color: #fff; background: var(--bad); }
.transport { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #2a2a2a; border-top: 1px solid var(--line); flex: none; }
.transport input[type=range] { flex: 1; min-width: 0; }
.time { font-family: var(--mono); font-size: 11px; min-width: 9.5ch; text-align: right; color: var(--text-hi); }

/* filmstrip */
.filmwrap { flex: none; background: #2a2a2a; border-top: 1px solid var(--line); }
.filminfo { display: flex; justify-content: space-between; padding: 3px 10px; font-size: 11px; color: var(--text); }
.filmstrip { display: flex; gap: 5px; padding: 4px 8px 8px; overflow-x: auto; height: 94px; }
.film { flex: none; width: 104px; display: flex; flex-direction: column; gap: 2px; padding: 2px; border: 1px solid transparent; background: transparent; text-align: left; border-radius: 1px; }
.film canvas { width: 100%; height: 66px; display: block; background: #111; }
.film.active { border-color: #888; background: #444; }
.film .meta { display: flex; justify-content: space-between; font-size: 10px; height: 12px; overflow: hidden; }
.film .st { color: var(--star); letter-spacing: 1px; }
.film .fp { color: var(--good); font-weight: 700; } .film .fx { color: var(--bad); font-weight: 700; }

/* library */
.lib { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; align-content: start; background: #262626; }
.lib .cell { background: #2f2f2f; border: 1px solid transparent; padding: 6px; text-align: left; border-radius: 2px; display: flex; flex-direction: column; gap: 4px; }
.lib .cell.active { border-color: #999; background: #3c3c3c; }
.lib .cell canvas { width: 100%; aspect-ratio: 3 / 2; background: #111; display: block; }
.lib .cell .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-hi); }
.lib .cell .rt { display: flex; justify-content: space-between; color: var(--star); }

/* panels (develop) */
.sec { border-bottom: 1px solid var(--line); }
.sec > header {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer;
  color: var(--text-hi); font-weight: 600; font-size: 12px; background: var(--panel-head); width: 100%; border: 0; text-align: left;
}
.sec > header::after {
  content: ""; margin-left: auto; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent;
  border-top: 5px solid #999;
}
.sec.closed > header::after { border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 5px solid #999; border-right: 0; }
.sec.closed > .body { display: none; }
.body { padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 3px; background: var(--panel); }
.sub { margin: 8px 0 2px; color: var(--text-hi); font-weight: 600; font-size: 11px; display: flex; align-items: center; justify-content: space-between; }
.row { display: grid; grid-template-columns: 74px minmax(0, 1fr) 46px; align-items: center; gap: 8px; min-height: 22px; }
.row .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .num {
  background: transparent; border: 0; border-bottom: 1px solid transparent; color: var(--text-hi); text-align: right; width: 100%;
  font-family: var(--mono); font-size: 11px; padding: 1px 0; user-select: text; -webkit-user-select: text;
}
.row .num:hover { border-bottom-color: #666; }
.row .num:focus { outline: none; border-bottom-color: var(--accent); background: #2a2a2a; }
input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 20px; background: transparent; margin: 0; touch-action: pan-y;
}
input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: var(--track, #5c5c5c); }
input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--track, #5c5c5c); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #d4d4d4; border: 1px solid #111; margin-top: -4.5px; }
input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: #d4d4d4; border: 1px solid #111; }
select, .field { width: 100%; background: #2a2a2a; border: 1px solid #4f4f4f; border-radius: 3px; padding: 5px 6px; color: var(--text-hi); user-select: text; -webkit-user-select: text; }
.note { font-size: 11px; color: #8a8a8a; margin: 2px 0; }
.seg { display: flex; gap: 2px; }
.seg button { flex: 1; padding: 4px 0; background: #2a2a2a; border: 1px solid #4f4f4f; border-radius: 3px; font-size: 11px; white-space: nowrap; }
.seg button.on { background: #5a5a5a; color: #fff; }

.histo-wrap { padding: 10px 12px 8px; background: var(--panel-head); border-bottom: 1px solid var(--line); }
#histo { width: 100%; height: 88px; display: block; background: #262626; border: 1px solid var(--line); }
.histo-meta { display: flex; justify-content: space-between; margin-top: 5px; gap: 8px; }
.histo-meta .file { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-hi); min-width: 0; }
.histo-meta .dims { white-space: nowrap; }
.toolstrip { display: flex; gap: 4px; padding: 6px 12px; background: var(--panel-head); border-bottom: 1px solid var(--line); }

.curve-wrap canvas, #wheel { width: 100%; display: block; background: #262626; border: 1px solid var(--line); touch-action: none; }
#curve { aspect-ratio: 1; cursor: crosshair; }
#wheel { width: 168px; height: 168px; margin: 4px auto; border-radius: 50%; border: 0; background: transparent; cursor: crosshair; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }

.nav canvas { width: 100%; height: 128px; display: block; background: #222; }
.nav .labels { display: flex; justify-content: space-between; margin-top: 4px; }
.preset-group h4 { margin: 0; padding: 6px 12px 3px; font-size: 11px; color: var(--text-hi); font-weight: 600; }
.preset-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 4px 12px 8px; }
.preset { background: transparent; border: 1px solid transparent; padding: 2px; text-align: left; border-radius: 2px; position: relative; }
.preset:hover { background: #484848; }
.preset canvas { width: 100%; aspect-ratio: 112 / 76; display: block; background: #111; }
.preset span { display: block; padding-top: 2px; color: var(--text-hi); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.preset .del { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: rgba(0,0,0,.65); color: #fff; line-height: 1; padding: 0; display: none; }
.preset:hover .del, .preset:focus-within .del { display: block; }
.save-preset { display: flex; gap: 6px; padding: 6px 12px 10px; }
.save-preset .field { flex: 1; min-width: 0; }
.list { list-style: none; margin: 0; padding: 2px 0 6px; }
.list li { padding: 4px 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; gap: 8px; }
.list li:hover { background: #484848; }
.list li.cur { background: #555; color: var(--text-hi); }
.list li.future { opacity: .45; }
.list li button { background: none; border: 0; color: #999; padding: 0 4px; }

.pop {
  position: fixed; z-index: 20; right: 10px; top: 44px; width: min(300px, calc(100vw - 20px));
  background: #3c3c3c; border: 1px solid #555; border-radius: 4px; padding: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.5);
  display: flex; flex-direction: column; gap: 10px;
}
.pop .row { grid-template-columns: 60px minmax(0,1fr) 40px; }
.toast {
  position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0));
  background: #111; color: var(--text-hi); border: 1px solid #555; padding: 8px 14px; border-radius: 4px;
  max-width: calc(100vw - 24px); box-shadow: 0 6px 18px rgba(0,0,0,.5); user-select: text; -webkit-user-select: text;
}
.hidden-input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }

body[data-module="library"] .viewer, body[data-module="library"] .toolbar, body[data-module="library"] .transport,
body[data-module="library"] .filmwrap, body[data-module="library"] .panel { display: none; }
body[data-module="develop"] .lib { display: none; }
body[data-module="library"] .workspace { grid-template-columns: 1fr; }

.tools { display: none; }
.mobile-only { display: none; }

/* ---- phone layout (Lightroom-mobile style) ---- */
@media (max-width: 860px) {
  .plate { margin-right: 4px; font-size: 13px; }
  .plate b, #modDev { display: none; }
  .topbar { gap: 0; padding: 0 6px; }
  .tb { padding: 7px 8px; }
  .histo-wrap { display: none; }
  body[data-module="library"] .tools { display: none; }
  .mobile-only { display: inline-flex; }
  .desktop-only { display: none !important; }
  .workspace { display: flex; flex-direction: column; }
  .stage { order: 0; flex: 1 1 auto; min-height: 0; }
  .panel { order: 1; flex: 0 0 var(--ph, 44%); border: 0; border-top: 1px solid var(--line); background: #2b2b2b; }
  body.collapsed .panel { display: none; }
  body[data-pane="left"] .panel.right, body[data-pane="right"] .panel.left { display: none; }
  .m-hide { display: none !important; }
  .sec > header { display: none; }
  .sec.closed > .body { display: flex; }
  .body { background: #2b2b2b; padding: 8px 16px 14px; gap: 6px; }
  .row { grid-template-columns: 1fr 52px; grid-template-areas: "l n" "s s"; row-gap: 0; min-height: 40px; }
  .row .l { grid-area: l; font-size: 12px; } .row .num { grid-area: n; font-size: 12px; } .row input[type=range] { grid-area: s; height: 26px; }
  .sub { font-size: 12px; }
  .foot { background: #2b2b2b; }
  .toolstrip { display: none; }
  .filmwrap { background: #1f1f1f; }
  .filminfo { display: none; }
  .filmstrip { height: 66px; padding: 4px 8px; }
  .film { width: 64px; } .film canvas { height: 40px; } .film .meta { display: none; }
  .toolbar { padding: 2px 8px; min-height: 30px; }
  .tools { display: flex; flex: none; background: #1f1f1f; border-top: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .tools::-webkit-scrollbar { display: none; }
  .tools button {
    flex: 1 0 64px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px 7px; background: none; border: 0;
    color: #8c8c8c; font-size: 10.5px;
  }
  .tools button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tools button.on { color: var(--accent); }
  .preset-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px 16px 10px; }
  .preset-group h4 { padding: 8px 16px 3px; font-size: 12px; }
  .save-preset { padding: 6px 16px 12px; }
  .list li { padding: 8px 16px; font-size: 12px; }
  .tb { padding: 7px 10px; }
  .nav { display: none; }
  #wheel { width: 190px; height: 190px; }
}
</style>
</head>
<body data-module="develop" data-tool="light" data-pane="right">

<header class="topbar">
  <div class="plate">PV <b>Edits</b></div>
  <nav class="modules">
    <button class="mod" id="modLib" type="button">Library</button>
    <button class="mod on" id="modDev" type="button">Develop</button>
  </nav>
  <span class="spacer"></span>
  <button class="tb" id="undoBtn" disabled>Undo</button>
  <button class="tb" id="redoBtn" disabled>Redo</button>
  <button class="tb mobile-only" id="beforeBtnTop" type="button">Before</button>
  <label class="tb" for="fileInput" id="importLabel">Import</label>
  <input class="hidden-input" type="file" id="fileInput" multiple>
  <button class="tb primary" id="exportBtn">Export</button>
</header>

<div class="workspace">
  <aside class="panel left" id="leftPanel">
    <div class="scroll">
      <section class="sec desktop-only" id="secNav">
        <header>Navigator</header>
        <div class="body nav"><canvas id="navCanvas" width="240" height="128"></canvas><div class="labels"><span id="navFit">FIT</span><span id="navInfo"></span></div></div>
      </section>
      <section class="sec" id="secPresets" data-mtool="presets">
        <header>Presets</header>
        <div class="body" style="padding:0">
          <div id="presetList"></div>
          <div class="save-preset">
            <input class="field" id="presetName" placeholder="Name this look" maxlength="40" aria-label="Preset name">
            <button class="btn small" id="savePreset">Save</button>
          </div>
        </div>
      </section>
      <section class="sec closed" id="secSnaps" data-mtool="history">
        <header>Snapshots</header>
        <div class="body" style="padding:0">
          <ul class="list" id="snapList"></ul>
          <div class="save-preset"><button class="btn small" id="addSnap" style="flex:1">Add snapshot</button></div>
        </div>
      </section>
      <section class="sec" id="secHistory" data-mtool="history">
        <header>History</header>
        <div class="body" style="padding:0"><ul class="list" id="historyList"></ul></div>
      </section>
    </div>
    <div class="foot" data-mtool="history">
      <button class="tb" id="copyBtn">Copy</button>
      <button class="tb" id="pasteBtn">Paste</button>
    </div>
  </aside>

  <main class="stage">
    <div class="viewer" id="viewer">
      <canvas id="view"></canvas>
      <div id="cropLayer" hidden>
        <div id="cropRect" data-h="move">
          <i class="hd" data-h="nw"></i><i class="hd" data-h="n"></i><i class="hd" data-h="ne"></i><i class="hd" data-h="e"></i>
          <i class="hd" data-h="se"></i><i class="hd" data-h="s"></i><i class="hd" data-h="sw"></i><i class="hd" data-h="w"></i>
        </div>
      </div>
      <div class="badge" id="beforeBadge" hidden>Before</div>
      <div class="empty" id="empty">
        <h2>Import LOG video, DNG or photos</h2>
        <p>Drop files here or choose them. Choose a .cube file to load a camera LUT.</p>
        <label class="btn primary" for="fileInput">Choose files</label>
      </div>
    </div>
    <div class="lib" id="libGrid"></div>
    <div class="toolbar" id="toolbar">
      <button class="tb desktop-only" id="cropBtn" title="Crop (R)">Crop</button>
      <button class="tb" id="beforeBtn" title="Hold to see original. Press \ to toggle.">Before / After</button>
      <span class="spacer"></span>
      <div class="stars" id="stars"></div>
      <button class="flag p" id="flagP" title="Pick (P)">P</button>
      <button class="flag x" id="flagX" title="Reject (X)">X</button>
    </div>
    <div class="transport" id="transport" hidden>
      <button class="btn small" id="playBtn" style="min-width:56px">Play</button>
      <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Seek">
      <span class="time" id="timeLabel">0:00 / 0:00</span>
      <button class="btn small" id="muteBtn">Muted</button>

  const v = m.src, wasLoop = v.loop; v.pause(); v.loop = false; v.currentTime = 0;
  await new Promise(r => { v.onseeked = r; if (v.currentTime === 0) r(); });
  state.dirty = true; ensureSize(m, m.settings); main.upload(); main.draw(m.settings);
  const rec = new MediaRecorder(viewCanvas.captureStream(30), { mimeType: mime, videoBitsPerSecond: 12e6 }), chunks = [];
  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  let cancelled = false; state.cancelExport = () => { cancelled = true; v.pause(); };
  const done = new Promise(r => { rec.onstop = r; });
  const finish = () => { if (rec.state !== 'inactive') rec.stop(); };
  v.onended = finish; v.onpause = () => { if (cancelled) finish(); };
  $('#expGo').disabled = true; $('#expCancel').textContent = 'Cancel';
  rec.start(); await v.play();
  const tick = setInterval(() => { $('#expNote').textContent = 'Recording ' + fmtTime(v.currentTime) + ' / ' + fmtTime(v.duration); }, 400);
  await done; clearInterval(tick);
  v.onended = null; v.onpause = null; v.loop = wasLoop; state.cancelExport = null;
  $('#expGo').disabled = false; $('#expCancel').textContent = 'Close';
  if (cancelled) { toast('Export cancelled', 2000); return; }
  const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm', fname = m.name.replace(/\.[^.]+$/, '') + '-edit.' + ext;
  download(new Blob(chunks, { type: mime.split(';')[0] }), fname); pop.hidden = true; toast('Exported ' + fname, 2500);
}

/* ---------- boot ---------- */
buildStars(); buildEditor(); renderPresets(); renderHistory(); renderSnaps(); drawCurve(); drawWheel(); renderLibrary();
$('#secCrop').hidden = !window.matchMedia('(max-width: 860px)').matches;
window.matchMedia('(max-width: 860px)').addEventListener('change', () => { applyTool(state.tool); $('#secCrop').hidden = !state.crop.on && !window.matchMedia('(max-width: 860px)').matches; });
if (main) requestAnimationFrame(loop);
window.__pv = { state, importFiles, applyTool };
