<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PV Edits</title>
<style>
:root {
  color-scheme: dark;
  --bg: #1a1a1a;
  --panel: #262626;
  --panel-2: #2f2f2f;
  --line: #121212;
  --edge: #3b3b3b;
  --text: #a9a9a9;
  --text-hi: #e9e9e9;
  --accent: #4e8fd6;
  --good: #6fae5a;
  --bad: #c4584c;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg); color: var(--text);
  font: 12px/1.35 var(--font);
  padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
  -webkit-text-size-adjust: 100%;
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* Top bar */
.topbar {
  display: flex; align-items: center; gap: 4px; padding: 6px 10px;
  background: var(--panel); border-bottom: 1px solid var(--line);
  overflow-x: auto; flex: none; scrollbar-width: none;
}
.topbar::-webkit-scrollbar { display: none; }
.brand { color: var(--text-hi); font-weight: 600; letter-spacing: .04em; margin-right: 6px; white-space: nowrap; }
.brand span { color: var(--accent); }
.sep { width: 1px; align-self: stretch; background: var(--edge); margin: 2px 4px; flex: none; }
.btn {
  background: var(--panel-2); border: 1px solid var(--edge); border-radius: 3px;
  padding: 5px 10px; white-space: nowrap; color: var(--text-hi); flex: none;
  display: inline-flex; align-items: center; justify-content: center;
}
.btn:hover { background: #383838; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.small { padding: 3px 8px; font-size: 11px; }
.spacer { flex: 1; }

/* Workspace */
.workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: 250px minmax(0, 1fr) 310px; }
.panel { background: var(--panel); overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
.panel.left { border-right: 1px solid var(--line); }
.panel.right { border-left: 1px solid var(--line); }
.stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.viewer {
  flex: 1; min-height: 0; position: relative; background: #101010;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
#view { width: 100%; height: 100%; object-fit: contain; display: block; }
.empty {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; text-align: center; padding: 20px; color: var(--text);
}
.empty h2 { margin: 0; font-size: 16px; font-weight: 600; color: var(--text-hi); }
.empty p { margin: 0; max-width: 34ch; }
.badge {
  position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.6); color: var(--text-hi);
  padding: 2px 8px; border-radius: 3px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
}
.dropping::after {
  content: "Drop files to import"; position: absolute; inset: 8px; border: 2px dashed var(--accent);
  display: flex; align-items: center; justify-content: center; color: var(--text-hi); background: rgba(20,20,20,.7);
  font-size: 15px; pointer-events: none;
}

.transport {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--panel);
  border-top: 1px solid var(--line); flex: none;
}
.transport input[type=range] { flex: 1; min-width: 0; }
.time { font-family: var(--mono); font-size: 11px; min-width: 9.5ch; text-align: right; color: var(--text-hi); }

.filmstrip {
  display: flex; gap: 6px; padding: 6px 8px; overflow-x: auto; flex: none; height: 98px;
  background: var(--panel); border-top: 1px solid var(--line);
}
.film {
  flex: none; width: 104px; display: flex; flex-direction: column; gap: 2px; padding: 2px; border: 1px solid transparent;
  background: transparent; text-align: left; border-radius: 2px;
}
.film canvas { width: 100%; height: 66px; display: block; background: #111; }
.film.active { border-color: var(--accent); background: #333; }
.film .meta { display: flex; justify-content: space-between; font-size: 10px; color: var(--text); height: 12px; overflow: hidden; }
.film .stars { color: #d8b255; letter-spacing: 1px; }
.film .flag-p { color: var(--good); font-weight: 700; }
.film .flag-x { color: var(--bad); font-weight: 700; }

/* Panels */
.sec { border-bottom: 1px solid var(--line); }
.sec > header {
  display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer; user-select: none;
  color: var(--text-hi); font-weight: 600; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  background: var(--panel-2); width: 100%; border: 0; text-align: left;
}
.sec > header::before {
  content: ""; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent;
  border-top: 5px solid var(--text); transition: transform .12s;
}
.sec.closed > header::before { transform: rotate(-90deg); }
.sec.closed > .body { display: none; }
.sec > header .hint { margin-left: auto; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--text); }
.body { padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 6px; }

.row { display: flex; flex-direction: column; gap: 3px; padding: 2px 0; }
.row .lab { display: flex; justify-content: space-between; gap: 8px; }
.row .lab span:first-child { cursor: default; }
.row .val { font-family: var(--mono); font-size: 11px; color: var(--text-hi); min-width: 5ch; text-align: right; }

input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 20px; background: transparent; margin: 0; touch-action: pan-y;
}
input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: var(--track, #5a5a5a); }
input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--track, #5a5a5a); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: #d0d0d0; border: 1px solid #111; margin-top: -5px;
}
input[type=range]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: #d0d0d0; border: 1px solid #111; }
input[type=range]:hover::-webkit-slider-thumb { background: #fff; }

select, .field {
  width: 100%; background: #1d1d1d; border: 1px solid var(--edge); border-radius: 3px; padding: 5px 6px; color: var(--text-hi);
}
.note { font-size: 11px; color: #858585; }

.histo-wrap { padding: 10px 12px 6px; background: var(--panel); border-bottom: 1px solid var(--line); }
#histo { width: 100%; height: 86px; display: block; background: #1b1b1b; border: 1px solid var(--line); }
.histo-meta { display: flex; justify-content: space-between; margin-top: 5px; font-size: 11px; gap: 8px; }
.histo-meta .file { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-hi); min-width: 0; }
.histo-meta .dims { color: var(--text); white-space: nowrap; }

.tabs { display: flex; gap: 2px; }
.tabs button { flex: 1; padding: 4px 0; background: #1d1d1d; border: 1px solid var(--edge); border-radius: 3px; font-size: 11px; }
.tabs button.on { background: #444; color: #fff; }
.hsl-grid { display: flex; flex-direction: column; gap: 4px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

.curve-wrap { position: relative; }
#curve { width: 100%; aspect-ratio: 1; display: block; background: #1b1b1b; border: 1px solid var(--line); touch-action: none; cursor: crosshair; }

.preset-group h4 { margin: 0; padding: 7px 12px 4px; font-size: 11px; letter-spacing: .06em; color: var(--text-hi); font-weight: 600; }
.preset-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 4px 12px 10px; }
.preset { background: transparent; border: 1px solid transparent; padding: 2px; text-align: left; border-radius: 2px; position: relative; }
.preset:hover { background: #333; }
.preset canvas { width: 100%; aspect-ratio: 112 / 76; display: block; background: #111; }
.preset span { display: block; padding-top: 2px; font-size: 11px; color: var(--text-hi); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.preset .del {
  position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: 0;
  background: rgba(0,0,0,.65); color: #fff; line-height: 1; padding: 0; display: none;
}
.preset:hover .del, .preset:focus-within .del { display: block; }
.save-preset { display: flex; gap: 6px; padding: 8px 12px; }
.save-preset .field { flex: 1; min-width: 0; }

.history { list-style: none; margin: 0; padding: 4px 0 8px; }
.history li { padding: 4px 12px; cursor: pointer; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history li:hover { background: #333; }
.history li.cur { background: #3d3d3d; color: var(--text-hi); }
.history li.future { opacity: .45; }

.pop {
  position: fixed; z-index: 20; right: 10px; top: 46px; width: min(300px, calc(100vw - 20px));
  background: var(--panel-2); border: 1px solid var(--edge); border-radius: 4px; padding: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,.5); display: flex; flex-direction: column; gap: 10px;
}
.toast {
  position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0));
  background: #111; color: var(--text-hi); border: 1px solid var(--edge); padding: 8px 14px; border-radius: 4px;
  max-width: calc(100vw - 24px); box-shadow: 0 6px 18px rgba(0,0,0,.5);
}
.hidden-input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }

.tabbar { display: none; }

@media (max-width: 860px) {
  .workspace { display: flex; flex-direction: column; }
  .stage { order: 0; flex: 1 1 auto; }
  .panel { order: 1; flex: 0 0 42%; border: 0; border-top: 1px solid var(--line); }
  body[data-tab="edit"] .panel.left, body[data-tab="presets"] .panel.right { display: none; }
  .tabbar { display: flex; flex: none; background: var(--panel); border-top: 1px solid var(--line); }
  .tabbar button {
    flex: 1; padding: 11px 0; background: transparent; border: 0; border-bottom: 2px solid transparent;
    font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
  }
  .tabbar button.on { color: var(--text-hi); border-bottom-color: var(--accent); }
  .filmstrip { height: 80px; }
  .film { width: 80px; }
  .film canvas { height: 50px; }
  .preset-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  input[type=range] { height: 28px; }
  .btn { padding: 7px 11px; }
  .viewer { min-height: 160px; }
  .histo-wrap { padding-top: 6px; }
  #histo { height: 60px; }
}
</style>
</head>
<body data-tab="edit">

<header class="topbar">
  <div class="brand">PV <span>Edits</span></div>
  <label class="btn primary" for="fileInput" id="importLabel">Import</label>
  <input class="hidden-input" type="file" id="fileInput" multiple>
  <span class="sep"></span>
  <button class="btn" id="undoBtn" disabled>Undo</button>
  <button class="btn" id="redoBtn" disabled>Redo</button>
  <span class="sep"></span>
  <button class="btn" id="copyBtn">Copy</button>
  <button class="btn" id="pasteBtn">Paste</button>
  <button class="btn" id="resetBtn">Reset</button>
  <span class="sep"></span>
  <button class="btn" id="beforeBtn" title="Show original (\)">Before / After</button>
  <span class="spacer"></span>
  <button class="btn primary" id="exportBtn">Export</button>
</header>

<div class="workspace">
  <aside class="panel left" id="leftPanel">
    <section class="sec" id="secPresets">
      <header>Presets</header>
      <div class="body" style="padding:0">
        <div id="presetList"></div>
        <div class="save-preset">
          <input class="field" id="presetName" placeholder="Name this look" maxlength="40" aria-label="Preset name">
          <button class="btn small" id="savePreset">Save</button>
        </div>
      </div>
    </section>
    <section class="sec" id="secHistory">
      <header>History</header>
      <div class="body" style="padding:0"><ul class="history" id="historyList"></ul></div>
    </section>
  </aside>

  <main class="stage">
    <div class="viewer" id="viewer">
      <canvas id="view"></canvas>
      <div class="badge" id="beforeBadge" hidden>Before</div>
      <div class="empty" id="empty">
        <h2>Import LOG video, DNG or photos</h2>
        <p>Drop files here or choose them. Pick a .cube file to load a camera LUT.</p>
        <label class="btn primary" for="fileInput">Choose files</label>
      </div>
    </div>
    <div class="transport" id="transport" hidden>
      <button class="btn small" id="playBtn" style="min-width:56px">Play</button>
      <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Seek">
      <span class="time" id="timeLabel">0:00 / 0:00</span>
      <button class="btn small" id="muteBtn">Muted</button>
      <button class="btn small on" id="loopBtn">Loop</button>
    </div>
    <div class="filmstrip" id="filmstrip"></div>
  </main>

  <aside class="panel right" id="rightPanel">
    <div class="histo-wrap">
      <canvas id="histo" width="256" height="86"></canvas>
      <div class="histo-meta"><span class="file" id="infoFile">No file</span><span class="dims" id="infoDims"></span></div>
    </div>
    <div id="editor"></div>
  </aside>
</div>

<nav class="tabbar" aria-label="Panels">
  <button data-tab="edit" class="on">Edit</button>
  <button data-tab="presets">Presets</button>
</nav>

<div class="pop" id="exportPop" hidden>
  <div class="row"><div class="lab"><span>Format</span></div><select id="expFormat"></select></div>
  <div class="row" id="expQualRow"><div class="lab"><span>Quality</span><span class="val" id="expQualVal">92</span></div>
    <input type="range" id="expQual" min="50" max="100" value="92"></div>
  <p class="note" id="expNote" style="margin:0"></p>
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button class="btn" id="expCancel">Close</button>
    <button class="btn primary" id="expGo">Export</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<input class="hidden-input" type="file" id="lutInput">

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const clone = (o) => JSON.parse(JSON.stringify(o));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    if (k === 'class') e.className = props[k];
    else if (k === 'text') e.textContent = props[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), props[k]);
    else e.setAttribute(k, props[k]);
  }
  kids.flat().forEach(c => c != null && e.append(c));
  return e;
}
let toastTimer;
function toast(msg, ms = 4500) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, ms);
}
const fmtTime = (s) => { s = Math.max(0, s || 0); return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); };

/* ---------- settings model ---------- */
const DEFAULTS = {
  profile: 'none', bw: false,
  temp: 0, tint: 0, exposure: 0, contrast: 0, highlights: 0, shadows: 0, whites: 0, blacks: 0,
  clarity: 0, vibrance: 0, saturation: 0,
  curve: [[0, 0], [1, 1]],
  shH: 215, shS: 0, miH: 40, miS: 0, hiH: 45, hiS: 0,
  sharpen: 0, vig: 0, vigMid: 50, grain: 0, lutAmt: 0
};
const BANDS = [
  ['Red', '#e0453a', 0], ['Orange', '#e8872e', 30], ['Yellow', '#e3cf3a', 60], ['Green', '#58b94c', 120],
  ['Aqua', '#3ec6c6', 180], ['Blue', '#4a7fe0', 240], ['Purple', '#9560d8', 270], ['Magenta', '#d54ba6', 300]
];
BANDS.forEach((_, i) => { DEFAULTS['h' + i] = 0; DEFAULTS['s' + i] = 0; DEFAULTS['l' + i] = 0; });
const ORIGINAL = Object.assign(clone(DEFAULTS), { profile: 'none' });
const PROFILES = [
  ['none', 'Standard (sRGB / Rec.709)'], ['slog3', 'Sony S-Log3'], ['vlog', 'Panasonic V-Log'],
  ['logc3', 'ARRI LogC3 (EI 800)'], ['flat', 'Flat / other LOG (generic)']
];
const PROFILE_ID = { none: 0, slog3: 1, vlog: 2, logc3: 3, flat: 4 };

const FADE = [[0, 0.06], [1, 0.96]];
const SCURVE = [[0, 0], [0.25, 0.2], [0.75, 0.8], [1, 1]];
const PRESET_GROUPS = [
  ['LOG to Rec.709', [
    ['S-Log3 base', { profile: 'slog3', contrast: 15, saturation: 12 }],
    ['V-Log base', { profile: 'vlog', contrast: 15, saturation: 12 }],
    ['LogC3 base', { profile: 'logc3', contrast: 12, saturation: 8 }],
    ['Flat LOG base', { profile: 'flat', saturation: 15 }]
  ]],
  ['Cinematic', [
    ['Teal & Orange', { contrast: 20, vibrance: 15, saturation: -5, shH: 195, shS: 38, hiH: 35, hiS: 32, curve: SCURVE }],
    ['Bleach Bypass', { contrast: 35, saturation: -45, clarity: 25, blacks: -10, grain: 10 }],
    ['Moody Blue', { exposure: -0.2, contrast: 15, temp: -15, saturation: -10, shH: 215, shS: 30, vig: -25 }],
    ['Golden Hour', { exposure: 0.1, temp: 35, tint: 5, highlights: -20, vibrance: 20, hiH: 40, hiS: 30, vig: -15 }],
    ['Neon Night', { contrast: 25, vibrance: 30, shH: 270, shS: 32, hiH: 180, hiS: 22, blacks: -8 }],
    ['Desert Dust', { temp: 22, contrast: 10, saturation: -12, h1: -8, s1: -10, shH: 30, shS: 15, curve: FADE }]
  ]],
  ['Film', [
    ['Warm Print', { temp: 12, contrast: 12, blacks: 15, shadows: 10, highlights: -10, saturation: -5, miH: 40, miS: 10, grain: 18, curve: FADE }],
    ['Cool Slide', { temp: -10, tint: -6, contrast: 8, h3: -15, s3: 10, blacks: 10, grain: 15 }],
    ['Faded Matte', { contrast: -15, blacks: 35, whites: -10, saturation: -15, curve: [[0, 0.1], [1, 0.95]] }],
    ['Cross Process', { contrast: 22, tint: 8, shH: 160, shS: 28, hiH: 55, hiS: 34, saturation: 8 }]
  ]],
  ['Black & White', [
    ['B&W Natural', { bw: true, contrast: 10 }],
    ['B&W High Contrast', { bw: true, contrast: 45, blacks: -20, whites: 15, clarity: 20 }],
    ['B&W Film Grain', { bw: true, contrast: 20, grain: 35, vig: -20, blacks: 10 }],
    ['B&W Low Key', { bw: true, exposure: -0.4, contrast: 30, shadows: -20, vig: -35 }]
  ]],
  ['Portrait & Landscape', [
    ['Soft Portrait', { exposure: 0.2, contrast: -10, highlights: -15, shadows: 15, clarity: -15, vibrance: 10, s0: -10, l1: 15 }],
    ['Vivid Landscape', { contrast: 20, clarity: 25, vibrance: 35, saturation: 10, highlights: -25, shadows: 20, s3: 15, s5: 15 }],
    ['Clean Bright', { exposure: 0.3, whites: 15, highlights: -10, shadows: 25, vibrance: 15 }]
  ]]
];

/* ---------- tone curve math ---------- */
function curveFn(pts) {
  const p = pts.slice().sort((a, b) => a[0] - b[0]);
  const n = p.length, xs = p.map(a => a[0]), ys = p.map(a => a[1]);
  const d = [], m = [];
  for (let i = 0; i < n - 1; i++) d[i] = (ys[i + 1] - ys[i]) / ((xs[i + 1] - xs[i]) || 1e-6);
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  return (x) => {
    if (x <= xs[0]) return clamp(ys[0], 0, 1);
    if (x >= xs[n - 1]) return clamp(ys[n - 1], 0, 1);
    let i = 0; while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h, t2 = t * t, t3 = t2 * t;
    return clamp((2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1], 0, 1);
  };
}
const curveIsIdentity = (c) => c.length === 2 && c[0][0] === 0 && c[0][1] === 0 && c[1][0] === 1 && c[1][1] === 1;
function hsvToRgb(h, s, v) {
  const f = (n) => { const k = (n + h * 6) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
  return [f(5), f(3), f(1)];
}

/* ---------- WebGL renderer ---------- */
const VERT = `
attribute vec2 p; varying vec2 vUv; varying vec2 vPos;
uniform vec2 uUvScale; uniform vec2 uUvOffset;
void main(){ vUv = (p*0.5+0.5)*uUvScale + uUvOffset; vPos = p; gl_Position = vec4(p,0.,1.); }`;
const FRAG = `

  const W = 256, H = 86; hctx.fillStyle = '#1b1b1b'; hctx.fillRect(0, 0, W, H);
  if (!cur()) return;
  hsx.drawImage(viewCanvas, 0, 0, 128, 72);
  const d = hsx.getImageData(0, 0, 128, 72).data, bins = [new Float32Array(256), new Float32Array(256), new Float32Array(256)];
  for (let i = 0; i < d.length; i += 4) { bins[0][d[i]]++; bins[1][d[i + 1]]++; bins[2][d[i + 2]]++; }
  let mx = 1; for (const b of bins) for (let i = 2; i < 254; i++) mx = Math.max(mx, b[i]);
  hctx.globalCompositeOperation = 'lighter';
  ['rgba(220,60,50,.85)', 'rgba(60,200,80,.85)', 'rgba(70,110,235,.85)'].forEach((col, k) => {
    hctx.fillStyle = col; hctx.beginPath(); hctx.moveTo(0, H);
    for (let i = 0; i < 256; i++) hctx.lineTo(i, H - Math.min(1, bins[k][i] / mx) * (H - 4));
    hctx.lineTo(255, H); hctx.fill();
  });
  hctx.globalCompositeOperation = 'source-over';
  const tot = 128 * 72, clipLo = (bins[0][0] + bins[1][0] + bins[2][0]) / (3 * tot), clipHi = (bins[0][255] + bins[1][255] + bins[2][255]) / (3 * tot);
  hctx.fillStyle = clipLo > 0.005 ? '#9ab' : '#444'; hctx.beginPath(); hctx.moveTo(2, 2); hctx.lineTo(12, 2); hctx.lineTo(2, 12); hctx.fill();
  hctx.fillStyle = clipHi > 0.005 ? '#fff' : '#444'; hctx.beginPath(); hctx.moveTo(W - 2, 2); hctx.lineTo(W - 12, 2); hctx.lineTo(W - 2, 12); hctx.fill();
}

/* ---------- render loop ---------- */
function loop() {
  const m = cur();
  if (m && main && !state.exporting) {
    const playing = m.type === 'video' && !m.src.paused;
    if (state.dirty || playing) {
      if (m.type === 'video' && m.src.readyState >= 2) main.upload();
      main.draw(state.before ? ORIGINAL : m.settings, { seed: m.type === 'video' ? (state.frame % 97) * 3.7 : 0 });
      if (state.dirty || state.frame % 6 === 0) drawHistogram();
      if (m.type === 'video') updateTransport();
      state.dirty = false; state.frame++;
    }
  }
  requestAnimationFrame(loop);
}

/* ---------- transport ---------- */
let scrubbing = false;
function updateTransport() {
  const m = cur(); if (!m || m.type !== 'video') return; const v = m.src;
  if (!scrubbing) $('#scrub').value = v.duration ? Math.round(v.currentTime / v.duration * 1000) : 0;
  $('#timeLabel').textContent = fmtTime(v.currentTime) + ' / ' + fmtTime(v.duration);
  $('#playBtn').textContent = v.paused ? 'Play' : 'Pause';
}
function togglePlay() { const m = cur(); if (!m || m.type !== 'video') return; const v = m.src; if (v.paused) v.play().catch(() => toast('Playback was blocked. Tap Play again.')); else v.pause(); state.dirty = true; updateTransport(); }
$('#playBtn').addEventListener('click', togglePlay);
$('#scrub').addEventListener('input', (e) => { const m = cur(); if (!m) return; scrubbing = true; m.src.currentTime = (e.target.value / 1000) * m.src.duration; });
$('#scrub').addEventListener('change', () => { scrubbing = false; });
$('#muteBtn').addEventListener('click', () => { const m = cur(); if (!m) return; m.src.muted = !m.src.muted; $('#muteBtn').textContent = m.src.muted ? 'Muted' : 'Sound'; });
$('#loopBtn').addEventListener('click', () => { const m = cur(); if (!m) return; m.src.loop = !m.src.loop; $('#loopBtn').classList.toggle('on', m.src.loop); });
document.addEventListener('seeked', () => { state.dirty = true; }, true);

/* ---------- toolbar ---------- */
$('#fileInput').addEventListener('change', (e) => importFiles(e.target.files));
$('#lutInput').addEventListener('change', async (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) { try { await applyLutFile(f); } catch (err) { toast(err.message); } } });
$('#undoBtn').addEventListener('click', undo); $('#redoBtn').addEventListener('click', redo);
$('#copyBtn').addEventListener('click', () => { const m = cur(); if (!m) return; state.clipboard = clone(m.settings); toast('Settings copied', 1400); });
$('#pasteBtn').addEventListener('click', () => {
  const m = cur(); if (!m || !state.clipboard) { toast('Copy settings from another file first.'); return; }
  const s = clone(state.clipboard); s.lutAmt = m.lut ? s.lutAmt : 0; setSettings(s, 'Paste settings');
});
$('#resetBtn').addEventListener('click', () => { const m = cur(); if (!m) return; const s = clone(DEFAULTS); setSettings(s, 'Reset all'); });
function toggleBefore() { state.before = !state.before; $('#beforeBtn').classList.toggle('on', state.before); $('#beforeBadge').hidden = !state.before; state.dirty = true; }
$('#beforeBtn').addEventListener('click', toggleBefore);
document.querySelectorAll('.tabbar button').forEach(b => b.addEventListener('click', () => {
  document.body.dataset.tab = b.dataset.tab; document.querySelectorAll('.tabbar button').forEach(x => x.classList.toggle('on', x === b));
}));

/* ---------- drag & drop ---------- */
const viewer = $('#viewer');
['dragenter', 'dragover'].forEach(t => window.addEventListener(t, (e) => { e.preventDefault(); viewer.classList.add('dropping'); }));
['dragleave', 'drop'].forEach(t => window.addEventListener(t, (e) => { e.preventDefault(); if (t === 'drop' || e.target === document.documentElement) viewer.classList.remove('dropping'); }));
window.addEventListener('drop', (e) => { if (e.dataTransfer && e.dataTransfer.files.length) importFiles(e.dataTransfer.files); });

/* ---------- keyboard ---------- */
window.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' && e.target.type !== 'range' || tag === 'select' || tag === 'textarea') return;
  const mod = e.ctrlKey || e.metaKey, m = cur();
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (mod && e.shiftKey && e.key.toLowerCase() === 'c') { e.preventDefault(); $('#copyBtn').click(); return; }
  if (mod && e.shiftKey && e.key.toLowerCase() === 'v') { e.preventDefault(); $('#pasteBtn').click(); return; }
  if (mod) return;
  if (e.key === '\\') { toggleBefore(); return; }
  if (!m) return;
  if (e.key === ' ' && m.type === 'video' && tag !== 'button') { e.preventDefault(); togglePlay(); return; }
  if (e.key === 'ArrowRight' && tag !== 'input') { if (state.cur < state.media.length - 1) selectMedia(state.cur + 1); return; }
  if (e.key === 'ArrowLeft' && tag !== 'input') { if (state.cur > 0) selectMedia(state.cur - 1); return; }
  if (/^[0-5]$/.test(e.key)) { m.rating = +e.key; updateFilmMeta(m); return; }
  if (e.key.toLowerCase() === 'p') { m.flag = m.flag === 'P' ? '' : 'P'; updateFilmMeta(m); return; }
  if (e.key.toLowerCase() === 'x') { m.flag = m.flag === 'X' ? '' : 'X'; updateFilmMeta(m); }
});

/* ---------- export ---------- */
const pop = $('#exportPop');
function download(blob, name) {
  const url = URL.createObjectURL(blob), a = el('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
}
$('#exportBtn').addEventListener('click', () => {
  const m = cur(); if (!m) { toast('Import a file first.'); return; }
  const sel = $('#expFormat'); sel.textContent = '';
  const opts = m.type === 'image' ? [['image/jpeg', 'JPEG'], ['image/png', 'PNG']] : [['video', 'Video (WebM / MP4)']];
  opts.forEach(([v, t]) => sel.append(el('option', { value: v, text: t })));
  $('#expNote').textContent = m.type === 'video'
    ? 'Video only (no audio). The edit is recorded in real time while the clip plays, at up to 2400 px on the long edge. Keep this tab open.'
    : 'Exports at full source resolution with all edits applied. For DNG files this is the embedded preview, not the raw data.';
  updateExpQual(); pop.hidden = !pop.hidden;
});
function updateExpQual() { $('#expQualRow').hidden = $('#expFormat').value !== 'image/jpeg'; $('#expQualVal').textContent = $('#expQual').value; }
$('#expFormat').addEventListener('change', updateExpQual); $('#expQual').addEventListener('input', updateExpQual);
$('#expCancel').addEventListener('click', () => { if (state.exporting && state.cancelExport) state.cancelExport(); pop.hidden = true; });
$('#expGo').addEventListener('click', async () => {
  const m = cur(); if (!m) return;
  try { m.type === 'image' ? await exportImage(m) : await exportVideo(m); } catch (e) { toast('Export failed: ' + e.message, 7000); state.exporting = false; sizeMain(m); state.dirty = true; }
});
async function exportImage(m) {
  const fmt = $('#expFormat').value, q = $('#expQual').value / 100;
  let w = m.w, h = m.h; const f = Math.min(1, main.maxTex / Math.max(w, h), Math.sqrt(16e6 / (w * h)));
  w = Math.round(w * f); h = Math.round(h * f);
  state.exporting = true; viewCanvas.width = w; viewCanvas.height = h;
  main.draw(m.settings);
  const blob = await new Promise(r => viewCanvas.toBlob(r, fmt, q));
  state.exporting = false; sizeMain(m); state.dirty = true;
  if (!blob) throw new Error('The browser could not encode the image.');
  const ext = fmt === 'image/png' ? 'png' : 'jpg', base = m.name.replace(/\.[^.]+$/, ''), fname = base + '-edit.' + ext;
  const file = new File([blob], fname, { type: fmt });
  if (window.matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); pop.hidden = true; return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  download(blob, fname); pop.hidden = true; toast('Exported ' + fname, 2500);
}
async function exportVideo(m) {
  if (!window.MediaRecorder) throw new Error('This browser cannot record video.');
  const types = ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'];
  const mime = types.find(t => MediaRecorder.isTypeSupported(t)); if (!mime) throw new Error('No supported video format found in this browser.');
  const v = m.src, wasLoop = v.loop; v.pause(); v.loop = false; v.currentTime = 0;
  await new Promise(r => { v.onseeked = r; if (v.currentTime === 0) r(); });
  state.dirty = true; main.upload(); main.draw(m.settings);
  const rec = new MediaRecorder(viewCanvas.captureStream(30), { mimeType: mime, videoBitsPerSecond: 12e6 }), chunks = [];
  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  let cancelled = false; state.cancelExport = () => { cancelled = true; v.pause(); };
  const done = new Promise(r => { rec.onstop = r; });
  const finish = () => { if (rec.state !== 'inactive') rec.stop(); };
  v.onended = finish; v.onpause = () => { if (cancelled) finish(); };
  $('#expGo').disabled = true; $('#expCancel').textContent = 'Cancel';
  rec.start(); await v.play();
  const tick = setInterval(() => { $('#expNote').textContent = 'Recording ' + fmtTime(v.currentTime) + ' / ' + fmtTime(v.duration); }, 400);
  await done; clearInterval(tick);
  v.onended = null; v.onpause = null; v.loop = wasLoop; state.cancelExport = null;
  $('#expGo').disabled = false; $('#expCancel').textContent = 'Close';
  if (cancelled) { toast('Export cancelled', 2000); return; }
  const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm', fname = m.name.replace(/\.[^.]+$/, '') + '-edit.' + ext;
  download(new Blob(chunks, { type: mime.split(';')[0] }), fname); pop.hidden = true; toast('Exported ' + fname, 2500);
}

/* ---------- boot ---------- */
buildEditor(); renderPresets(); renderHistory(); drawCurve();
if (main) requestAnimationFrame(loop);
window.__pv = { state, importFiles };
</script>
</body>
</html>
